[workspace]
resolver = "3"
members = [
    "crates/stc-core",
    "crates/stc-cli",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://example.invalid/samsung-t-series-console"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Storage_FileSystem",
] }
